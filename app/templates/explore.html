<!DOCTYPE html>
<html>
<head>
	<title>Feeding the Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/explore.css') }}" />
<script src="{{ url_for('static', filename='js/explore.js') }}" defer></script>
<script src="https://kit.fontawesome.com/d6f697fed0.js" crossorigin="anonymous"></script>
</head>

<body>
	<nav>
        <input type="checkbox" id="check">
        <label for="check" class="checkbtn">
            <i class="fas fa-bars"></i>
        </label>
        <label class = "logo"> Feeding the Community</label>
        <ul>
            <li><a class="homepg" href="/">Home</a></li>
            <li><a class="explorepg" href="/explore">Explore</a></li>
            <li><a class="aboutpg" href="/about">About Us</a></li>
        </ul>
    </nav>
	<br>

	<main>
		<br>
		<h1>Enter a ZIP code to search</h1>
		<br>
		<div class="search-group">
		<label id = "label" for="search-input" class="visually-hidden" hidden>ZIP code </label>
		<input
		 type="text"
		 id = "search-input" 
		 placeholder="Enter ZIP code" 
		 required minlength="5" 
		 maxlength="10" 
		 inputmode="numeric"/>
		<br>
		<button type="button" id="search-btn">Submit</button>
		</div>

		<div id="message-box" role="alert"></div>
		<div id="message-container"></div>
  
	</main>

</body>
</html>
